name: 📚 Contenido educativo
description: Error, corrección o propuesta en una lección, quiz o glosario
title: "content: "
labels: ["content"]
body:
  - type: markdown
    attributes:
      value: |
        Para errores en el contenido que ve el estudiante: conceptos
        incorrectos, faltas de ortografía, respuestas mal marcadas o
        propuestas de lecciones nuevas.

  - type: dropdown
    id: tipo
    attributes:
      label: Tipo
      options:
        - Error de concepto (información incorrecta)
        - Respuesta marcada como correcta que no lo es
        - Falta de ortografía o redacción confusa
        - Contenido demasiado difícil para la edad
        - Propuesta de lección nueva
        - Propuesta de preguntas nuevas
        - Término faltante en el glosario
    validations:
      required: true

  - type: dropdown
    id: nivel
    attributes:
      label: Nivel
      options:
        - Chispa
        - Maker
        - Inventor
        - Glosario
        - Preguntas de torneo
        - No aplica
    validations:
      required: true

  - type: input
    id: ubicacion
    attributes:
      label: Lección o pregunta afectada
      description: Indica el título o el id si lo conoces.
      placeholder: "Lección «¿Qué es un robot?» · id chispa_ch1 · pregunta cq3"

  - type: textarea
    id: problema
    attributes:
      label: Qué está mal (o qué falta)
      placeholder: |
        La pregunta cq3 marca como correcta la opción "Un libro". La respuesta
        correcta debería ser "Un rover de Marte".
    validations:
      required: true

  - type: textarea
    id: correccion
    attributes:
      label: Corrección o contenido propuesto
      description: Si es una lección nueva, esboza tarjetas y preguntas.
      placeholder: |
        Cambiar el índice de la respuesta correcta de 2 a 1.

  - type: textarea
    id: fuente
    attributes:
      label: Fuente
      description: Si corriges un dato técnico, indica en qué te basas.

  - type: checkboxes
    id: comprobaciones
    attributes:
      label: Antes de enviar
      options:
        - label: Revisé que el texto propuesto no tenga faltas de ortografía
          required: true
        - label: El lenguaje es apropiado para niños y adolescentes
          required: true
