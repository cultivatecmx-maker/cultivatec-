name: 🐛 Reporte de error
description: Algo no funciona como debería
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportarlo. Cuanto más concreto seas, antes se arregla.

        > ⚠️ **¿Es un problema de seguridad?** No lo reportes aquí.
        > Sigue [SECURITY.md](../blob/main/SECURITY.md).

        > ⚠️ **Tapa cualquier dato personal** (nombres, correos) en las
        > capturas que adjuntes.

  - type: textarea
    id: descripcion
    attributes:
      label: Qué ocurre
      description: Describe el problema en una o dos frases.
      placeholder: Al terminar un quiz con 8/10, la lección siguiente sigue bloqueada.
    validations:
      required: true

  - type: textarea
    id: pasos
    attributes:
      label: Cómo reproducirlo
      description: Pasos exactos, desde abrir la app.
      placeholder: |
        1. Abrir la app e iniciar sesión
        2. Ir a Aprender → nivel Chispa
        3. Completar la lección 3 con 8 de 10 aciertos
        4. Volver al camino de lecciones
    validations:
      required: true

  - type: textarea
    id: esperado
    attributes:
      label: Qué esperabas que pasara
      placeholder: La lección 4 debería aparecer desbloqueada (el umbral es 70 %).
    validations:
      required: true

  - type: textarea
    id: capturas
    attributes:
      label: Capturas o vídeo
      description: Arrastra los archivos aquí. Opcional pero muy útil.

  - type: dropdown
    id: plataforma
    attributes:
      label: Plataforma
      multiple: true
      options:
        - Android
        - iOS
        - Web
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: input
    id: dispositivo
    attributes:
      label: Dispositivo y versión del sistema
      placeholder: Samsung Galaxy A54 · Android 14

  - type: input
    id: version
    attributes:
      label: Versión de la app
      description: La encuentras en Ajustes, o en `pubspec.yaml`.
      placeholder: 2.5.0

  - type: dropdown
    id: frecuencia
    attributes:
      label: Con qué frecuencia ocurre
      options:
        - Siempre
        - Casi siempre
        - A veces
        - Solo me pasó una vez
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Información adicional
      description: Mensajes de error de la consola, contexto, lo que sea relevante.

  - type: checkboxes
    id: comprobaciones
    attributes:
      label: Antes de enviar
      options:
        - label: Busqué entre los issues abiertos y este problema no estaba reportado
          required: true
        - label: Tapé los datos personales en las capturas que adjunté
          required: true
