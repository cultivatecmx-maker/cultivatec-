name: CI

# Comprobación automática de calidad.
# Se ejecuta en cada pull request hacia main y en cada push a main.
# Si algo aquí se pone en rojo, el pull request no debe fusionarse.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Si se sube un commit nuevo a un PR, cancela la ejecución anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.27.4"
  WORKING_DIR: cultivatec_flutter

jobs:
  calidad:
    name: Análisis, formato y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Comprobar el formato del código
        run: dart format --line-length 120 --output=none --set-exit-if-changed lib test

      - name: Análisis estático
        run: flutter analyze

      - name: Pruebas
        run: flutter test --reporter expanded

  compilacion:
    name: Compilación de Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Solo se ejecuta si la comprobación de calidad pasó.
    needs: calidad

    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      # Compila en modo depuración: verifica que el proyecto compila sin
      # necesitar la clave de firma de release.
      - name: Compilar APK de depuración
        run: flutter build apk --debug
