name: cultivatec_flutter
description: >-
  CultivaTec — plataforma educativa gamificada de robótica y STEM para niños
  y adolescentes. Software propietario de CultivaTec.
publish_to: 'none'

# version: <nombre-visible>+<código de build>
# Sube el código de build en CADA publicación a las tiendas.
version: 2.5.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.8.1
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.0
  provider: ^6.1.2
  go_router: ^14.8.1
  google_fonts: ^9.0.0
  flutter_svg: ^2.0.17
  audioplayers: ^6.1.0
  shared_preferences: ^2.3.4
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.2
  intl: ^0.20.3
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/images/wokov/
    - assets/images/wokov/layers/
    - assets/sounds/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/iconodeapp.png"
